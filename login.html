<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login for E-Voting</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
            margin-top: 80px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .button {
            background-color: #28a745;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }
        .button:hover {
            background-color: #218838;
        }
        .register-link {
            margin-top: 15px;
            display: block;
        }
    </style>
    </head>
    <body>

        <header>
            <h2>Login for E-Voting</h2>
        </header>

        <div class="container">
            <h2>Login</h2>
            <form>
                <input type="text" placeholder="Enter Aadhaar or PAN Number"
                    required>
                <input type="password" placeholder="Enter Password" required>
                <button onclick="window.location.href='main.html'"
                    class="button">Login</button>
            </form>
            <a href="register.html" class="register-link">Don't have an account?
                Register here</a>
        </div>

    </body>
</html>
