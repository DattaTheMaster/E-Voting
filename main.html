<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Choose Voting Category</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .container {
            display: flex;
            flex-direction: row;
            padding: 50px;
        }
        .option {
            background: white;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            height: 125px;
            transition: all 0.3s ease-in-out;
        }
        .option:hover {
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.2);
            transform: scale(1.02);
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 10px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .button:hover {
            background-color: #218838;
            transform: scale(1.05);
            transition: all 0.3s ease-in-out;
        }
        .image{
            margin-top: 35px;
        }
        .image img{
            border-radius: 12px;
        }
    </style>
    </head>
    <body>
        <header>Choose Your Voting Category</header>
        <div class="image"><img src="main voting.png" width="350px"
                height="350px"></div>
        <div class="container">
            <div class="option">
                <h2>Vote for Central Government</h2>
                <a href="central.html" class="button">Proceed</a>
            </div>
            <div class="option">
                <h2>Vote for State Government</h2>
                <a href="state.html" class="button">Proceed</a>
            </div>
            <div class="option">
                <h2>Vote for Panchayat</h2>
                <a href="panchayat.html" class="button">Proceed</a>
            </div>
        </div>
    </body>
</html>
