<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - Secure E-Voting</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            font-size: 24px;
        }
        .container {
            padding: 20px;
        }
        .form-container {
            background: white;
            padding: 20px;
            margin: auto;
            width: 50%;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        input, button {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
    </head>
    <body>
        <header>Register for Secure E-Voting</header>
        <div class="container">
            <div class="form-container">
                <h2>Create an Account</h2>
                <form>
                    <input type="text" placeholder="Enter Aadhaar Number"
                        required><br>
                    <input type="text" placeholder="Enter PAN Number"
                        required><br>
                    <input type="tel" placeholder="Enter Mobile Number"
                        required><br>
                    <a href="login.html">Already have an account? Login</a>
                    <button onclick="window.location.href='main.html'"
                        type="submit">Register(Click Twice)</button>
                </form>
            </div>
        </div>
    </body>
</html>
